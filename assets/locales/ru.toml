title = "SSH через брандмауэр"
summary = "Добавляет одно правило брандмауэра, которое разрешает SSH на порту 22, чтобы брандмауэр оставался включённым, а вы могли по-прежнему подключаться к этому компьютеру удалённо. Правило, созданное вами, не затрагивается, а отмена удаляет только правило, добавленное qtools."
