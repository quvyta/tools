# Russian: checked against en.toml, with the four plural forms Russian needs.

[meta]
name = "Русский"
code = "ru"

[group]
packages = "Пакеты"
security = "Безопасность"
hardware = "Оборудование"
appearance = "Внешний вид"
maintenance = "Обслуживание"

[tweak.mirrors]
title = "Список зеркал"
summary = "Выбирает самые быстрые зеркала в вашей стране и обновляет их каждую неделю."

[tweak.pacman-options]
title = "Настройки pacman"
summary = "Загружает пакеты параллельно, включает цветной вывод и полные списки версий."

[tweak.multilib]
title = "Репозиторий multilib"
summary = "Добавляет 32-битный репозиторий, который нужен Steam и некоторым драйверам. Его пакеты можно будет установить после вашего следующего полного обновления системы."

[tweak.aur-helper]
title = "Помощник AUR"
summary = "Собирает помощник AUR из исходников, чтобы пакеты вне официальных репозиториев ставились одной командой."

[tweak.cache-cleanup]
title = "Очистка кэша"
summary = "По еженедельному таймеру оставляет только несколько последних версий каждого скачанного пакета."

[tweak.ssd-trim]
title = "TRIM для SSD"
summary = "Раз в неделю сообщает SSD, какие блоки свободны, чтобы он оставался быстрым и служил дольше."

[tweak.journal-limit]
title = "Размер журнала"
summary = "Ограничивает место на диске, которое может занять системный журнал, отдельным drop-in файлом. Вступает в силу при следующей загрузке или перезапуске journald."

[tweak.time-sync]
title = "Синхронизация времени"
summary = "Поддерживает точное время с помощью службы времени из состава systemd."

[tweak.microcode]
title = "Микрокод процессора"
summary = "Устанавливает микрокод вашего процессора и добавляет hook `microcode` в mkinitcpio для initramfs, поэтому загрузчик не затрагивается. Загрузится при следующей загрузке; пересборка занимает около минуты."

[tweak.zram-swap]
title = "Сжатый своп в ОЗУ"
summary = "Добавляет сжатый swap в оперативной памяти размером в половину памяти, но не больше 8 ГБ, в дополнение к уже имеющемуся swap. Включается при следующей загрузке или следующем запуске службы zram."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Устанавливает bluez и его утилиты, включает службу Bluetooth."

[tweak.laptop-power]
title = "Управление питанием ноутбука"
summary = "Устанавливает tlp и включает его с настройками по умолчанию. Отступает в сторону, если питанием уже управляет power-profiles-daemon."

[tweak.nvidia-wayland]
title = "NVIDIA и Wayland"
summary = "Включает modesetting ядра NVIDIA и её службы сна и пробуждения, нужные для плавной сессии Wayland, и пересобирает initramfs, чтобы настройка попала и туда. Действует после следующей загрузки; пересборка занимает около минуты."

[tweak.firewall]
title = "Брандмауэр"
summary = "Устанавливает и включает ufw: входящие соединения блокируются, исходящие разрешены. qtools ничего не открывает, SSH тоже; компьютер, к которому вы подключаетесь по SSH, перестанет принимать новые соединения, поэтому применяйте это, сидя за самим компьютером."

[tweak.ssh-hardening]
title = "Защита SSH"
summary = "Отключает вход по паролю и вход под root через SSH в отдельном файле. sshd прочитает его при следующем запуске, например при следующей загрузке; после этого войти можно только по ключу, поэтому на удалённом компьютере убедитесь, что ваш ключ уже установлен."

[tweak.qt-gtk-match]
title = "Qt подстраивается под GTK"
summary = "Заставляет приложения Qt использовать цвета и шрифты GTK. Вступает в силу при следующем входе в систему."

[tweak.fonts]
title = "Шрифты"
summary = "Делает семейство Noto системным шрифтом по умолчанию для обычного, с засечками и моноширинного текста, добавляя эмодзи-начертание как запасной вариант."

