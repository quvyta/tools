# Türkçe: qtools'un doğal dili.

[meta]
name = "Türkçe"
code = "tr"

[group]
packages = "Paketler"
security = "Güvenlik"
hardware = "Donanım"
appearance = "Görünüm"
maintenance = "Bakım"

[tweak.mirrors]
title = "Yansı listesi"
summary = "Ülkendeki en hızlı yansıları seçer ve her hafta yeniler."

[tweak.pacman-options]
title = "Pacman ayarları"
summary = "Paketleri paralel indirir, çıktıyı renkli ve ayrıntılı gösterir."

[tweak.multilib]
title = "Multilib deposu"
summary = "Steam ve bazı sürücülerin ihtiyaç duyduğu 32 bit depoyu ekler. Paketleri bir sonraki tam sistem güncellemesinden sonra kurulabilir."

[tweak.aur-helper]
title = "AUR yardımcısı"
summary = "Resmi depoların dışındaki paketleri tek komutla kurabilmen için kaynağından bir AUR yardımcısı derler."

[tweak.cache-cleanup]
title = "Önbellek temizliği"
summary = "İndirilen paketlerin yalnızca son birkaç sürümünü tutar, bunu haftalık bir zamanlayıcıyla yapar."

[tweak.ssd-trim]
title = "SSD trim"
summary = "Haftada bir SSD'ye hangi blokların boş olduğunu söyler; disk hızlı kalır, ömrü uzar."

[tweak.journal-limit]
title = "Günlük boyutu sınırı"
summary = "Sistem günlüğünün diskte kaplayabileceği alanı kendi ek dosyasıyla sınırlar. Bir sonraki açılışta ya da journald yeniden başlatılınca geçerli olur."

[tweak.time-sync]
title = "Zaman eşitleme"
summary = "Saati systemd'nin kendi zaman servisiyle doğru tutar."

[tweak.microcode]
title = "İşlemci mikrokodu"
summary = "İşlemcinin mikrokodunu kurar ve mkinitcpio'nun `microcode` kancasını initramfs'e ekler, böylece önyükleyicine dokunulmaz. Bir sonraki açılışta yüklenir; initramfs'i yeniden kurmak yaklaşık bir dakika sürer."

[tweak.zram-swap]
title = "RAM'de sıkıştırılmış takas"
summary = "Belleğinin yarısı büyüklüğünde, en fazla 8 GB, RAM içinde sıkıştırılmış bir takas alanı ekler; var olan takas alanına dokunmaz, ona ek gelir. Bir sonraki açılışta ya da zram servisi yeniden başlayınca etkin olur."

[tweak.bluetooth]
title = "Bluetooth"
summary = "bluez ve araçlarını kurar, Bluetooth servisini açar."

[tweak.laptop-power]
title = "Dizüstü güç yönetimi"
summary = "tlp'yi kurar ve kendi varsayılanlarıyla açar. power-profiles-daemon zaten çalışan bir makinede kenara çekilir."

[tweak.nvidia-wayland]
title = "NVIDIA ve Wayland"
summary = "Wayland oturumunun düzgün çalışması için NVIDIA'nın kip ayarını (modesetting) ve uyku sonrası servislerini etkinleştirir, ayar initramfs'e de girsin diye onu yeniden kurar. Bir sonraki açılışta geçerli olur; yeniden kurmak bir dakika kadar sürer."

[tweak.firewall]
title = "Güvenlik duvarı"
summary = "ufw'yi kurar ve açar: dışarıdan gelen bağlantılar engellenir, dışarıya gidenler serbesttir. qtools SSH dahil hiçbir kapı açmaz; SSH ile bağlandığın bir makine yeni bağlantı almaz olur, bunu makinenin başındayken uygula."

[tweak.firewall-ssh]
title = "Güvenlik duvarında SSH"
summary = "Güvenlik duvarına SSH'nin 22. kapıdan girmesine izin veren tek bir kural ekler; böylece duvar açıkken bu makineye uzaktan bağlanmaya devam edebilirsin. Senin eklediğin bir kurala dokunmaz, geri alınca da yalnızca kendi eklediği kuralı siler."

[tweak.ssh-hardening]
title = "SSH sıkılaştırma"
summary = "SSH'de parolayla girişi ve root girişini kendi ek dosyasıyla kapatır. sshd bu dosyayı bir sonraki başlayışında, örneğin bir sonraki açılışta okur; o andan sonra yalnızca anahtarla girilebilir, bu yüzden uzaktan bağlandığın bir makinede anahtarının önceden yüklü olduğundan emin ol."

[tweak.qt-gtk-match]
title = "Qt, GTK'ye uyar"
summary = "Qt uygulamalarının GTK'nın renk ve yazı tipi ayarını izlemesini sağlar. Bir sonraki oturum açılışında geçerli olur."

[tweak.fonts]
title = "Yazı tipleri"
summary = "Noto yazı tipi ailesini sistem genelinde düz, tırnaklı ve eş aralıklı yazı için varsayılan yapar, emoji yüzünü yedek olarak ekler."

