# French: checked against en.toml, the fallback.

[meta]
name = "Français"
code = "fr"

[group]
packages = "Paquets"
security = "Sécurité"
hardware = "Matériel"
appearance = "Apparence"
maintenance = "Entretien"

[tweak.mirrors]
title = "Liste de miroirs"
summary = "Choisit les miroirs les plus rapides de votre pays et les actualise chaque semaine."

[tweak.pacman-options]
title = "Options de pacman"
summary = "Télécharge les paquets en parallèle et affiche les couleurs et les listes de versions complètes."

[tweak.multilib]
title = "Dépôt multilib"
summary = "Ajoute le dépôt 32 bits dont Steam et certains pilotes ont besoin. Ses paquets pourront être installés après votre prochaine mise à jour complète du système."

[tweak.aur-helper]
title = "Assistant AUR"
summary = "Compile un assistant AUR depuis les sources, pour installer d’une seule commande les paquets hors des dépôts officiels."

[tweak.cache-cleanup]
title = "Nettoyage du cache"
summary = "Ne garde que les dernières versions de chaque paquet téléchargé, grâce à un minuteur hebdomadaire."

[tweak.ssd-trim]
title = "TRIM du SSD"
summary = "Indique une fois par semaine à votre SSD quels blocs sont libres, pour qu’il reste rapide et dure plus longtemps."

[tweak.journal-limit]
title = "Taille du journal"
summary = "Limite la place que le journal système peut occuper sur le disque, via un fichier drop-in dédié. Prend effet au prochain démarrage ou au prochain redémarrage de journald."

[tweak.time-sync]
title = "Synchro de l’heure"
summary = "Garde l’horloge à l’heure grâce au service de temps fourni avec systemd."

[tweak.microcode]
title = "Microcode du processeur"
summary = "Installe le microcode de votre processeur et ajoute le hook `microcode` de mkinitcpio à l’initramfs, pour ne pas toucher à votre bootloader. Il est chargé au prochain démarrage ; la reconstruction prend environ une minute."

[tweak.zram-swap]
title = "Swap compressé en RAM"
summary = "Ajoute un swap compressé en RAM, de la moitié de votre mémoire et d’au plus 8 Go, en plus de tout swap existant. Il devient actif au prochain démarrage ou au prochain lancement du service zram."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Installe bluez et ses outils, et active le service Bluetooth."

[tweak.laptop-power]
title = "Énergie du portable"
summary = "Installe tlp et l’active avec ses réglages par défaut. S’écarte si power-profiles-daemon gère déjà l’énergie."

[tweak.nvidia-wayland]
title = "NVIDIA et Wayland"
summary = "Active le modesetting du noyau de NVIDIA et ses services de mise en veille, nécessaires à une session Wayland fluide, et reconstruit l’initramfs pour que le réglage y soit aussi. Prend effet au prochain démarrage ; la reconstruction prend environ une minute."

[tweak.firewall]
title = "Pare-feu"
summary = "Installe ufw et l’active : les connexions entrantes sont bloquées, les sortantes autorisées. qtools n’ouvre rien, pas même SSH ; une machine que vous joignez par SSH n’accepte donc plus de nouvelles connexions : appliquez ceci devant la machine elle-même."

[tweak.ssh-hardening]
title = "Durcissement SSH"
summary = "Désactive les connexions SSH par mot de passe et en root, dans un fichier à part. sshd le lit à son prochain démarrage, par exemple au prochain démarrage de la machine ; ensuite seules les clés passent, alors sur une machine que vous joignez à distance, vérifiez que votre clé y est déjà installée."

[tweak.qt-gtk-match]
title = "Qt suit GTK"
summary = "Fait suivre aux applications Qt les couleurs et les polices de GTK. Prend effet à la prochaine connexion."

[tweak.fonts]
title = "Polices"
summary = "Fait de la famille Noto la police système par défaut pour le texte sans-serif, serif et à espacement fixe, avec sa variante emoji ajoutée en secours."

