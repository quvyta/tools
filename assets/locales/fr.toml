"channel-not-made" = "Le canal de contrôle n’a pas pu être créé, cette exécution a donc son propre terminal : {reason}"
"not-asked" = "La session qui garde un seul terminal pendant tout qtools est terminée ; cette exécution a donc son propre terminal : {reason}"
"gone" = "La session qui garde un seul terminal pendant tout qtools est terminée ; cette exécution n’a pas eu lieu."

