[tweak.firewall-ssh]
title = "SSH à travers le pare-feu"
summary = "Ajoute une règle de pare-feu qui laisse passer SSH sur le port 22, afin que le pare-feu puisse rester actif tout en vous permettant de joindre cette machine à distance. Une règle que vous avez créée vous-même est laissée telle quelle, et l’annulation supprime uniquement la règle ajoutée par qtools."
