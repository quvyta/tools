# English: the final fallback language. Every other locale is checked against this file.

[meta]
name = "English"
code = "en"

[group]
packages = "Packages"
security = "Security"
hardware = "Hardware"
appearance = "Appearance"
maintenance = "Maintenance"

[tweak.mirrors]
title = "Mirror list"
summary = "Picks the fastest mirrors in your country and refreshes them every week."

[tweak.pacman-options]
title = "Pacman options"
summary = "Downloads packages in parallel and shows colour and full version lists."

[tweak.multilib]
title = "Multilib repository"
summary = "Adds the 32-bit repository, needed by Steam and by some drivers. Its packages can be installed after your next full system upgrade."

[tweak.aur-helper]
title = "AUR helper"
summary = "Builds an AUR helper from source, so packages outside the official repositories install with one command."

[tweak.cache-cleanup]
title = "Cache cleanup"
summary = "Keeps only the last few versions of each downloaded package, on a weekly timer."

[tweak.ssd-trim]
title = "SSD trim"
summary = "Tells your SSD once a week which blocks are free, so it stays fast and lasts longer."

[tweak.journal-limit]
title = "Journal size limit"
summary = "Caps how much disk the system log may use, through a drop-in of its own. It takes effect at the next boot or the next restart of journald."

[tweak.time-sync]
title = "Time sync"
summary = "Keeps the clock right with the time service systemd ships."

[tweak.microcode]
title = "Processor microcode"
summary = "Installs your processor's microcode and adds mkinitcpio's `microcode` hook to the initramfs, so your bootloader is not touched. It is loaded at the next boot; the rebuild takes about a minute."

[tweak.zram-swap]
title = "Compressed swap in RAM"
summary = "Adds a compressed swap device in RAM, half the size of your memory and at most 8 GB, on top of any swap you already have. It becomes active at the next boot or the next start of the zram service."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Installs bluez and its tools and turns the Bluetooth service on."

[tweak.laptop-power]
title = "Laptop power management"
summary = "Installs tlp and turns it on, at its own defaults. It steps aside on a machine already managed by power-profiles-daemon."

[tweak.nvidia-wayland]
title = "NVIDIA and Wayland"
summary = "Enables NVIDIA's kernel modesetting and its suspend hand-off services, needed for a smooth Wayland session, and rebuilds the initramfs so the setting is in it too. It takes effect at the next boot; the rebuild takes about a minute."

[tweak.firewall]
title = "Firewall"
summary = "Installs ufw and turns it on: incoming connections are blocked, outgoing ones are allowed. qtools opens nothing, SSH included, so a machine you reach over SSH stops taking new connections; apply this one at the machine itself."

[tweak.firewall-ssh]
title = "SSH through the firewall"
summary = "Adds one firewall rule that lets SSH in on port 22, so the firewall can be on while you still reach this machine remotely. A rule you made yourself is left alone, and undoing removes only the rule qtools added."

[tweak.ssh-hardening]
title = "SSH hardening"
summary = "Turns off password and root logins over SSH in a drop-in of its own. sshd reads it when it next starts, at the next boot for instance; from then on only keys get in, so on a machine you reach remotely make sure your key is already in place."

[tweak.qt-gtk-match]
title = "Qt matches GTK"
summary = "Makes Qt applications follow GTK's colours and fonts. Takes effect the next time you log in."

[tweak.fonts]
title = "Fonts"
summary = "Makes the Noto family the system default for sans, serif and monospace text, with its emoji face added as a fallback."

