# The session that holds one terminal for a whole qtools: the process that carries the runs out,
# and the screen's side of it. {channel} is where the control channel would be, {reason} what the
# machine said about it.
[session]
"no-folder" = "There is nowhere on this machine to keep a session's control channel, so the password will be asked for every run."
"unknown-request" = "The session was asked for something else and did nothing."
"channel-failed" = "The session could not open its control channel {channel}: {reason}"
"channel-not-made" = "The control channel could not be made, so this run has a terminal of its own: {reason}"
"not-asked" = "The session that keeps one terminal for the whole qtools has ended, so this run has a terminal of its own: {reason}"
"gone" = "The session that keeps one terminal for the whole qtools has ended, so this run was not carried out."

