"file-ends" = "{file} holds something else; it ends before line {line}."
"list-not-set" = "{key} is set neither in {file} nor in {folder}."
"list-unreadable" = "{key} is set in {file}, but that file cannot be read now."
"list-not-understood" = "{file} sets the list in a way qtools does not change: {found}"
"list-not-in-file" = "{file} no longer sets the list."
"changed-after-write" = "{file} was changed after qtools wrote it, so it was left as it is and nothing was undone."
"backup-missing" = "The backup of {file} is gone ({backup}), so the file was left as it is and nothing was undone."
"nothing-recorded" = "qtools did not do this one, so it has nothing to undo."
