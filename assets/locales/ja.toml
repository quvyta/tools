"file-missing" = "{file} がありません。"
"section-missing" = "{file} に [{section}] セクションがありません。"
"option-differs" = "{file} ではすでに {key} が {found} に設定されています。"
"file-differs" = "{file} の内容が異なります。{line} 行目: {found}"
"file-ends" = "{file} の内容が異なります。{line} 行目より前でファイルが終わっています。"
"list-not-set" = "{key} は {file} にも {folder} にも設定されていません。"
"list-unreadable" = "{key} は {file} で設定されていますが、今そのファイルを読めません。"
"list-not-understood" = "{file} は qtools が変更しない書き方でリストを設定しています: {found}"
"list-not-in-file" = "{file} はもうリストを設定していません。"
"changed-after-write" = "{file} は qtools が書き込んだ後に変更されています。そのままにして、何も元に戻していません。"
"backup-missing" = "{file} のバックアップがありません（{backup}）。ファイルはそのままにして、何も元に戻していません。"
"nothing-recorded" = "これは qtools が行ったものではないため、元に戻すものはありません。"
"record-does-not-match" = "ステップ {step} の qtools の記録がこの項目と合わなくなりました。何も元に戻していません。"
"not-recorded" = "変更を記録できなかったため、元に戻しました: {why}"
"not-recorded-left" = "変更を記録することも元に戻すこともできず、システムに残っています: {why}"
"write-refused" = "{file} に書き込めませんでした。"
"write-refused-said" = "{file} に書き込めませんでした: {said}"
"root-to-read" = "root だけが、これが行われているかどうかを読み取れます。適用するときは、qtools がパスワード入力後に先に確認し、すでに存在しているものはそのままにします。"
"unreadable" = "qtools はこの状態を読み取れませんでした：{why}"
# The session that holds one terminal for a whole qtools: the process that carries the runs out,
# and the screen's side of it. {channel} is where the control channel would be, {reason} what the
# machine said about it.
[session]
"no-folder" = "このマシンにはセッションの制御チャンネルを置く場所がないため、実行のたびにパスワードを尋ねます。"
"unknown-request" = "セッションに別のことが求められ、何もしませんでした。"
"channel-failed" = "セッションは制御チャンネル {channel} を開けませんでした: {reason}"
"channel-not-made" = "制御チャンネルを作れなかったため、この実行には専用の端末が使われます: {reason}"
"not-asked" = "qtools の間ずっと一つの端末を保つセッションが終了したため、この実行には専用の端末が使われます: {reason}"
"gone" = "qtools の間ずっと一つの端末を保つセッションが終了したため、この実行は行われませんでした。"

