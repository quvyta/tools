[tweak.firewall-ssh]
title = "ファイアウォール越しの SSH"
summary = "ポート 22 で SSH を許可するファイアウォールルールを 1 つ追加します。ファイアウォールを有効にしたまま、このマシンにリモートから接続できるようにします。自分で作成したルールはそのまま残し、元に戻す場合は qtools が追加したルールのみを削除します。"
