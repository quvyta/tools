# Japanese: checked against en.toml; Japanese has a single plural form.

[meta]
name = "日本語"
code = "ja"

[group]
packages = "パッケージ"
security = "セキュリティ"
hardware = "ハードウェア"
appearance = "外観"
maintenance = "メンテナンス"

[tweak.mirrors]
title = "ミラーリスト"
summary = "お住まいの国で最も速いミラーを選び、毎週更新します。"

[tweak.pacman-options]
title = "pacman の設定"
summary = "パッケージを並列でダウンロードし、カラー表示と詳細なバージョン一覧を有効にします。"

[tweak.multilib]
title = "multilib リポジトリ"
summary = "Steam や一部のドライバーに必要な 32 ビットリポジトリを追加します。次回システム全体を更新した後に、そのパッケージをインストールできます。"

[tweak.aur-helper]
title = "AUR ヘルパー"
summary = "AUR ヘルパーをソースからビルドし、公式リポジトリにないパッケージもコマンド一つでインストールできるようにします。"

[tweak.cache-cleanup]
title = "キャッシュ整理"
summary = "毎週のタイマーで、ダウンロード済みの各パッケージを最新の数バージョンだけ残します。"

[tweak.ssd-trim]
title = "SSD TRIM"
summary = "空いているブロックを週に一度 SSD に伝え、速さを保ち寿命を延ばします。"

[tweak.journal-limit]
title = "ジャーナル容量制限"
summary = "システムログが使えるディスク容量を専用の drop-in ファイルで制限します。次回の起動か journald の再起動で有効になります。"

[tweak.time-sync]
title = "時刻同期"
summary = "systemd 付属の時刻サービスで時計を正確に保ちます。"

[tweak.microcode]
title = "プロセッサーのマイクロコード"
summary = "お使いのプロセッサーのマイクロコードをインストールし、mkinitcpio の `microcode` フックを initramfs に追加します。ブートローダーは変更しません。次回の起動時に読み込まれ、再ビルドには約 1 分かかります。"

[tweak.zram-swap]
title = "RAM 上の圧縮スワップ"
summary = "メモリの半分、最大 8 GB の圧縮スワップを RAM 上に追加します。既存のスワップはそのまま残ります。次回の起動時か、zram サービスの次回起動時に有効になります。"

[tweak.bluetooth]
title = "Bluetooth"
summary = "bluez とそのツールをインストールし、Bluetooth サービスを有効にします。"

[tweak.laptop-power]
title = "ノート PC の電源管理"
summary = "tlp をインストールし、既定の設定で有効にします。power-profiles-daemon が既に電源を管理している場合は手を出しません。"

[tweak.nvidia-wayland]
title = "NVIDIA と Wayland"
summary = "スムーズな Wayland セッションに必要な NVIDIA のカーネルモード設定とスリープ関連サービスを有効にし、設定が initramfs にも入るよう再ビルドします。次回の起動時に有効になり、再ビルドには約 1 分かかります。"

[tweak.firewall]
title = "ファイアウォール"
summary = "ufw をインストールして有効にします。受信接続はブロックされ、送信接続は許可されます。qtools は SSH を含め何も開放しないため、SSH で接続しているマシンは新しい接続を受け付けなくなります。マシンの前で適用してください。"

[tweak.ssh-hardening]
title = "SSH の強化"
summary = "専用の設定ファイルで SSH のパスワードログインと root ログインを無効にします。sshd は次回起動時（たとえば次回のシステム起動時）にこれを読み込み、それ以降は鍵でしかログインできません。リモートで接続するマシンでは、鍵がすでに配置されていることを確認してください。"

[tweak.qt-gtk-match]
title = "Qt を GTK に合わせる"
summary = "Qt アプリケーションが GTK の色とフォントに従うようにします。次回のログインから有効になります。"

[tweak.fonts]
title = "フォント"
summary = "Noto フォントファミリーをシステム全体のサンセリフ・セリフ・等幅のデフォルトにし、絵文字書体を代替として追加します。"

