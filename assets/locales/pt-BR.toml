"no-folder" = "Não há onde guardar o canal de controle de uma sessão nesta máquina, então a senha será pedida em cada execução."
"unknown-request" = "Foi pedido outra coisa à sessão, e ela não fez nada."
"channel-failed" = "A sessão não conseguiu abrir o seu canal de controle {channel}: {reason}"
"channel-not-made" = "Não foi possível criar o canal de controle, então esta execução tem um terminal só dela: {reason}"
"not-asked" = "A sessão que mantém um único terminal durante todo o qtools terminou, então esta execução tem um terminal só dela: {reason}"
"gone" = "A sessão que mantém um único terminal durante todo o qtools terminou, então esta execução não foi realizada."

