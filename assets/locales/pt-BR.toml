# Brazilian Portuguese: checked against en.toml, the fallback.

[meta]
name = "Português (Brasil)"
code = "pt-BR"

[group]
packages = "Pacotes"
security = "Segurança"
hardware = "Hardware"
appearance = "Aparência"
maintenance = "Manutenção"

[tweak.mirrors]
title = "Espelhos"
summary = "Escolhe os espelhos mais rápidos do seu país e os atualiza toda semana."

[tweak.pacman-options]
title = "Opções do pacman"
summary = "Baixa pacotes em paralelo e mostra cores e listas completas de versões."

[tweak.multilib]
title = "Repositório multilib"
summary = "Adiciona o repositório de 32 bits, necessário para o Steam e para alguns drivers. Os pacotes dele poderão ser instalados depois da sua próxima atualização completa do sistema."

[tweak.aur-helper]
title = "Auxiliar do AUR"
summary = "Compila um auxiliar do AUR a partir do código-fonte, para instalar com um só comando pacotes de fora dos repositórios oficiais."

[tweak.cache-cleanup]
title = "Limpeza do cache"
summary = "Mantém só as últimas versões de cada pacote baixado, com um timer semanal."

[tweak.ssd-trim]
title = "TRIM do SSD"
summary = "Informa ao seu SSD uma vez por semana quais blocos estão livres, para que ele continue rápido e dure mais."

[tweak.journal-limit]
title = "Limite do journal"
summary = "Limita quanto espaço em disco o log do sistema pode ocupar, com um arquivo drop-in próprio. Vale a partir da próxima inicialização ou do próximo reinício do journald."

[tweak.time-sync]
title = "Sincronia do relógio"
summary = "Mantém o relógio certo com o serviço de horário que vem com o systemd."

[tweak.microcode]
title = "Microcódigo do processador"
summary = "Instala o microcódigo do seu processador e adiciona o hook `microcode` do mkinitcpio ao initramfs, sem mexer no bootloader. Ele é carregado na próxima inicialização; a reconstrução leva cerca de um minuto."

[tweak.zram-swap]
title = "Swap comprimida na RAM"
summary = "Adiciona um swap comprimido na RAM, com metade da sua memória e no máximo 8 GB, além de qualquer swap que você já tenha. Fica ativo na próxima inicialização ou no próximo início do serviço zram."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Instala o bluez e suas ferramentas e ativa o serviço de Bluetooth."

[tweak.laptop-power]
title = "Energia do notebook"
summary = "Instala o tlp e o ativa com seus próprios valores padrão. Ele se afasta quando o power-profiles-daemon já cuida da energia."

[tweak.nvidia-wayland]
title = "NVIDIA e Wayland"
summary = "Ativa o modesetting do kernel da NVIDIA e os serviços de suspensão dela, necessários para uma sessão Wayland fluida, e reconstrói o initramfs para que a configuração também esteja nele. Vale a partir da próxima inicialização; a reconstrução leva cerca de um minuto."

[tweak.firewall]
title = "Firewall"
summary = "Instala o ufw e o liga: conexões de entrada são bloqueadas, as de saída são permitidas. O qtools não abre nada, nem o SSH; uma máquina que você acessa por SSH deixa de aceitar novas conexões, então aplique isto na própria máquina."

[tweak.ssh-hardening]
title = "Proteção do SSH"
summary = "Desativa o login por senha e como root via SSH em um arquivo próprio. O sshd o lê na próxima vez que iniciar, por exemplo na próxima inicialização; a partir daí só entram chaves, então, numa máquina que você acessa remotamente, confira se a sua chave já está instalada."

[tweak.qt-gtk-match]
title = "Qt segue o GTK"
summary = "Faz os aplicativos Qt seguirem as cores e as fontes do GTK. Vale a partir do próximo login."

[tweak.fonts]
title = "Fontes"
summary = "Torna a família Noto o padrão do sistema para texto sans, serifado e monoespaçado, com a variante de emoji adicionada como alternativa."

