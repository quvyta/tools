# Brazilian Portuguese: checked against en.toml, the fallback.

[meta]
name = "Português (Brasil)"
code = "pt-BR"

[group]
packages = "Pacotes"
security = "Segurança"
hardware = "Hardware"
appearance = "Aparência"
maintenance = "Manutenção"

[tweak.mirrors]
title = "Espelhos"
summary = "Escolhe os espelhos mais rápidos do seu país e os atualiza toda semana."

[tweak.pacman-options]
title = "Opções do pacman"
summary = "Baixa pacotes em paralelo e mostra cores e listas completas de versões."

[tweak.multilib]
title = "Repositório multilib"
summary = "Adiciona o repositório de 32 bits, necessário para o Steam e alguns drivers. Ele passa a funcionar depois da próxima atualização completa (`pacman -Syu`)."

[tweak.aur-helper]
title = "Auxiliar do AUR"
summary = "Compila um auxiliar do AUR a partir do código-fonte, para instalar com um só comando pacotes de fora dos repositórios oficiais."

[tweak.cache-cleanup]
title = "Limpeza do cache"
summary = "Mantém só as últimas versões de cada pacote baixado, com um timer semanal."

[tweak.ssd-trim]
title = "TRIM do SSD"
summary = "Informa ao seu SSD uma vez por semana quais blocos estão livres, para que ele continue rápido e dure mais."

[tweak.journal-limit]
title = "Limite do journal"
summary = "Limita quanto espaço em disco o log do sistema pode ocupar, com um arquivo drop-in próprio. Vale a partir da próxima inicialização ou do próximo reinício do journald."

[tweak.time-sync]
title = "Sincronia do relógio"
summary = "Mantém o relógio certo com o serviço de horário que vem com o systemd."

[tweak.firewall]
title = "Firewall"
summary = "Instala o ufw e o ativa: conexões de entrada são bloqueadas, as de saída são permitidas. O qtools não abre nada, então o SSH e qualquer outro serviço que precise continuar acessível precisam de uma regra ufw allow própria."

[tweak.ssh-hardening]
title = "Proteção do SSH"
summary = "Desativa o login por senha e o login como root via SSH, em um arquivo drop-in próprio. Vale a partir do próximo reinício do sshd; daí em diante só se entra com chave, então, numa máquina que você acessa remotamente, confira se a sua chave já está instalada."

