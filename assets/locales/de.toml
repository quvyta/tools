[tweak.firewall-ssh]
title = "SSH durch die Firewall"
summary = "Fügt eine Firewall-Regel hinzu, die SSH auf Port 22 zulässt, damit die Firewall aktiv bleibt, während du diesen Rechner weiterhin aus der Ferne erreichst. Eine selbst erstellte Regel wird nicht angefasst, und beim Rückgängigmachen wird nur die von qtools hinzugefügte Regel entfernt."
