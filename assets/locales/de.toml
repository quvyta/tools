# German: checked against en.toml, the fallback.

[meta]
name = "Deutsch"
code = "de"

[group]
packages = "Pakete"
security = "Sicherheit"
hardware = "Hardware"
appearance = "Darstellung"
maintenance = "Wartung"

[tweak.mirrors]
title = "Spiegelliste"
summary = "Wählt die schnellsten Spiegelserver in deinem Land und aktualisiert sie jede Woche."

[tweak.pacman-options]
title = "Pacman-Optionen"
summary = "Lädt Pakete parallel herunter und zeigt Farben und vollständige Versionslisten."

[tweak.multilib]
title = "Multilib-Repository"
summary = "Fügt das 32-Bit-Repository hinzu, das Steam und manche Treiber brauchen. Seine Pakete lassen sich nach deinem nächsten vollständigen Systemupdate installieren."

[tweak.aur-helper]
title = "AUR-Helfer"
summary = "Baut einen AUR-Helfer aus den Quellen, damit sich Pakete außerhalb der offiziellen Repositorys mit einem Befehl installieren lassen."

[tweak.cache-cleanup]
title = "Paketcache aufräumen"
summary = "Behält von jedem heruntergeladenen Paket nur die letzten paar Versionen, per wöchentlichem Timer."

[tweak.ssd-trim]
title = "SSD-Trim"
summary = "Teilt deiner SSD einmal pro Woche mit, welche Blöcke frei sind, damit sie schnell bleibt und länger hält."

[tweak.journal-limit]
title = "Journal-Größenlimit"
summary = "Begrenzt über eine eigene Drop-in-Datei, wie viel Platz das Systemprotokoll belegen darf. Wirksam ab dem nächsten Systemstart oder dem nächsten Neustart von journald."

[tweak.time-sync]
title = "Zeitsynchronisation"
summary = "Hält die Uhr mit dem Zeitdienst von systemd genau."

[tweak.microcode]
title = "Prozessor-Microcode"
summary = "Installiert den Microcode deines Prozessors und fügt den `microcode`-Hook von mkinitcpio zum initramfs hinzu, ohne den Bootloader anzufassen. Geladen wird er beim nächsten Systemstart; der Neubau dauert etwa eine Minute."

[tweak.zram-swap]
title = "Komprimierter Swap im RAM"
summary = "Legt einen komprimierten Swap im RAM an, halb so groß wie dein Arbeitsspeicher und höchstens 8 GB, zusätzlich zu jedem Swap, den du schon hast. Aktiv ab dem nächsten Start oder dem nächsten Start des zram-Dienstes."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Installiert bluez und seine Werkzeuge und schaltet den Bluetooth-Dienst ein."

[tweak.laptop-power]
title = "Laptop-Energie"
summary = "Installiert tlp und schaltet es mit seinen eigenen Standardwerten ein. Tritt zurück, wenn power-profiles-daemon die Energieverwaltung schon übernimmt."

[tweak.nvidia-wayland]
title = "NVIDIA und Wayland"
summary = "Aktiviert NVIDIAs Kernel-Modesetting und die Dienste für Ruhezustand und Aufwachen, die eine flüssige Wayland-Sitzung braucht, und baut das initramfs neu, damit die Einstellung auch dort ankommt. Wirksam ab dem nächsten Start; der Neubau dauert etwa eine Minute."

[tweak.firewall]
title = "Firewall"
summary = "Installiert ufw und schaltet es ein: eingehende Verbindungen werden blockiert, ausgehende erlaubt. qtools öffnet nichts, auch SSH nicht; ein Rechner, den du über SSH erreichst, nimmt dann keine neuen Verbindungen mehr an, also wende das direkt am Rechner an."

[tweak.ssh-hardening]
title = "SSH-Härtung"
summary = "Schaltet Anmeldungen per Passwort und als root über SSH in einer eigenen Drop-in-Datei ab. sshd liest sie beim nächsten Start, etwa beim nächsten Hochfahren; danach kommen nur noch Schlüssel hinein, also stell auf einem Rechner, den du aus der Ferne erreichst, sicher, dass dein Schlüssel schon hinterlegt ist."

[tweak.qt-gtk-match]
title = "Qt folgt GTK"
summary = "Lässt Qt-Anwendungen den Farben und Schriften von GTK folgen. Wirksam ab der nächsten Anmeldung."

[tweak.fonts]
title = "Schriftarten"
summary = "Macht die Schriftfamilie Noto zum systemweiten Standard für serifenlose, Serifen- und Festbreitenschrift, mit ihrem Emoji-Schriftschnitt als Rückfalloption."

