"channel-not-made" = "No se pudo crear el canal de control, así que esta ejecución tiene una terminal propia: {reason}"
"not-asked" = "La sesión que mantiene una sola terminal durante todo qtools ha terminado, así que esta ejecución tiene una terminal propia: {reason}"
"gone" = "La sesión que mantiene una sola terminal durante todo qtools ha terminado, así que esta ejecución no se realizó."

