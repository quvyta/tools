# Spanish: checked against en.toml, the fallback.

[meta]
name = "Español"
code = "es"

[group]
packages = "Paquetes"
security = "Seguridad"
hardware = "Hardware"
appearance = "Apariencia"
maintenance = "Mantenimiento"

[tweak.mirrors]
title = "Lista de espejos"
summary = "Elige los espejos más rápidos de tu país y los actualiza cada semana."

[tweak.pacman-options]
title = "Opciones de pacman"
summary = "Descarga paquetes en paralelo y muestra colores y listas de versiones completas."

[tweak.multilib]
title = "Repositorio multilib"
summary = "Añade el repositorio de 32 bits que necesitan Steam y algunos controladores. Sus paquetes se pueden instalar después de tu próxima actualización completa del sistema."

[tweak.aur-helper]
title = "Asistente de AUR"
summary = "Compila un asistente de AUR desde el código fuente, para instalar con un solo comando paquetes de fuera de los repositorios oficiales."

[tweak.cache-cleanup]
title = "Limpieza de caché"
summary = "Conserva solo las últimas versiones de cada paquete descargado, con un temporizador semanal."

[tweak.ssd-trim]
title = "TRIM del SSD"
summary = "Indica a tu SSD una vez por semana qué bloques están libres, para que siga rápido y dure más."

[tweak.journal-limit]
title = "Límite del registro"
summary = "Limita cuánto disco puede ocupar el registro del sistema, mediante un archivo drop-in propio. Se aplica en el próximo arranque o al reiniciar journald."

[tweak.time-sync]
title = "Sincronización horaria"
summary = "Mantiene el reloj en hora con el servicio de tiempo que trae systemd."

[tweak.microcode]
title = "Microcódigo del procesador"
summary = "Instala el microcódigo de tu procesador y añade el hook `microcode` de mkinitcpio al initramfs, así que el gestor de arranque no se toca. Se carga en el próximo arranque; la reconstrucción tarda alrededor de un minuto."

[tweak.zram-swap]
title = "Swap comprimida en RAM"
summary = "Añade un swap comprimido en la RAM, de la mitad de tu memoria y como mucho 8 GB, además de cualquier swap que ya tengas. Se activa en el próximo arranque o al reiniciar el servicio zram."

[tweak.bluetooth]
title = "Bluetooth"
summary = "Instala bluez y sus herramientas, y activa el servicio de Bluetooth."

[tweak.laptop-power]
title = "Energía del portátil"
summary = "Instala tlp y lo activa con sus valores predeterminados. Se aparta si power-profiles-daemon ya gestiona la energía."

[tweak.nvidia-wayland]
title = "NVIDIA y Wayland"
summary = "Activa el modesetting del kernel de NVIDIA y sus servicios de suspensión, necesarios para una sesión de Wayland fluida, y reconstruye el initramfs para que el ajuste también esté ahí. Se aplica en el próximo arranque; la reconstrucción tarda alrededor de un minuto."

[tweak.firewall]
title = "Cortafuegos"
summary = "Instala ufw y lo activa: las conexiones entrantes se bloquean y las salientes se permiten. qtools no abre nada, ni siquiera SSH, así que un equipo al que llegas por SSH deja de aceptar conexiones nuevas; aplícalo desde el propio equipo."

[tweak.ssh-hardening]
title = "Endurecer SSH"
summary = "Desactiva el inicio de sesión con contraseña y como root por SSH con un archivo propio. sshd lo lee la próxima vez que arranca, por ejemplo en el próximo inicio; desde entonces solo entran las claves, así que en un equipo al que accedes a distancia asegúrate de que tu clave ya esté instalada."

[tweak.qt-gtk-match]
title = "Qt sigue a GTK"
summary = "Hace que las aplicaciones Qt sigan los colores y las fuentes de GTK. Se aplica en el próximo inicio de sesión."

[tweak.fonts]
title = "Tipografías"
summary = "Convierte la familia Noto en la predeterminada del sistema para texto sans, serif y monoespaciado, con su variante de emoji añadida como alternativa."

