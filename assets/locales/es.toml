[tweak.firewall-ssh]
title = "SSH a través del cortafuegos"
summary = "Añade una regla de cortafuegos que permite SSH en el puerto 22, para que el cortafuegos pueda estar activado mientras sigues accediendo a este equipo a distancia. Una regla que hayas creado tú se deja como está, y deshacer solo elimina la regla que añadió qtools."
