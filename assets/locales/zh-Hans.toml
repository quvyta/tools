# Simplified Chinese: checked against en.toml; Chinese has a single plural form.

[meta]
name = "简体中文"
code = "zh-Hans"

[group]
packages = "软件包"
security = "安全"
hardware = "硬件"
appearance = "外观"
maintenance = "维护"

[tweak.mirrors]
title = "镜像源列表"
summary = "选出你所在国家最快的镜像源，并每周刷新一次。"

[tweak.pacman-options]
title = "pacman 选项"
summary = "并行下载软件包，并启用彩色输出和完整的版本列表。"

[tweak.multilib]
title = "multilib 仓库"
summary = "添加 Steam 和部分驱动所需的 32 位软件仓库。在你下一次完整更新系统后即可安装其中的软件包。"

[tweak.aur-helper]
title = "AUR 助手"
summary = "从源码构建一个 AUR 助手，官方仓库之外的软件包也能一条命令装好。"

[tweak.cache-cleanup]
title = "缓存清理"
summary = "用每周运行的定时器清理下载的软件包，每个只保留最近几个版本。"

[tweak.ssd-trim]
title = "SSD TRIM"
summary = "每周告诉 SSD 一次哪些块是空闲的，让它保持高速、寿命更长。"

[tweak.journal-limit]
title = "日志大小限制"
summary = "通过单独的 drop-in 配置限制系统日志占用的磁盘空间。下次开机或 journald 重启后生效。"

[tweak.time-sync]
title = "时间同步"
summary = "用 systemd 自带的时间服务让时钟保持准确。"

[tweak.microcode]
title = "处理器微码"
summary = "安装你处理器的微码，并在 initramfs 中添加 mkinitcpio 的 `microcode` 钩子，因此不会改动你的引导程序。下次开机时加载；重建大约需要一分钟。"

[tweak.zram-swap]
title = "内存中的压缩交换分区"
summary = "在内存中添加一个压缩交换空间，大小为内存的一半，最多 8 GB，并与你已有的交换空间并存。下次开机或下次启动 zram 服务时生效。"

[tweak.bluetooth]
title = "蓝牙"
summary = "安装 bluez 及其工具，并启用蓝牙服务。"

[tweak.laptop-power]
title = "笔记本电源管理"
summary = "安装 tlp 并以其默认设置启用。如果 power-profiles-daemon 已经在管理电源，则让路。"

[tweak.nvidia-wayland]
title = "NVIDIA 与 Wayland"
summary = "启用 NVIDIA 的内核模式设置及其休眠相关服务，让 Wayland 会话更顺畅，并重建 initramfs，让这项设置也进入其中。下次开机时生效；重建大约需要一分钟。"

[tweak.firewall]
title = "防火墙"
summary = "安装并启用 ufw：阻止传入连接，允许传出连接。qtools 不会开放任何端口，包括 SSH；你通过 SSH 连接的机器将不再接受新连接，所以请在机器本地应用此项。"

[tweak.ssh-hardening]
title = "SSH 加固"
summary = "用单独的配置文件关闭 SSH 的密码登录和 root 登录。sshd 会在下次启动时读取它，例如下次开机时；之后只能用密钥登录，所以在你远程访问的机器上，请先确认你的密钥已经就位。"

[tweak.qt-gtk-match]
title = "Qt 跟随 GTK"
summary = "让 Qt 应用跟随 GTK 的颜色和字体设置。下次登录后生效。"

[tweak.fonts]
title = "字体"
summary = "将 Noto 字体家族设为系统默认的无衬线、衬线和等宽字体，并加入其表情符号字重作为后备。"

