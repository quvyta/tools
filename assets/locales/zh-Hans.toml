[tweak.firewall-ssh]
title = "SSH 通过防火墙"
summary = "添加一条防火墙规则，放行 22 端口的 SSH 连接，这样防火墙开启时你仍能远程访问这台机器。你自己添加的规则保持不变，撤销时只移除 qtools 添加的规则。"
