# Simplified Chinese: checked against en.toml; Chinese has a single plural form.

[meta]
name = "简体中文"
code = "zh-Hans"

[group]
packages = "软件包"
security = "安全"
hardware = "硬件"
appearance = "外观"
maintenance = "维护"

[tweak.mirrors]
title = "镜像源列表"
summary = "选出你所在国家最快的镜像源，并每周刷新一次。"

[tweak.pacman-options]
title = "pacman 选项"
summary = "并行下载软件包，并启用彩色输出和完整的版本列表。"

[tweak.multilib]
title = "multilib 仓库"
summary = "添加 Steam 和部分驱动所需的 32 位仓库。下次完整升级（`pacman -Syu`）后即可使用。"

[tweak.aur-helper]
title = "AUR 助手"
summary = "从源码构建一个 AUR 助手，官方仓库之外的软件包也能一条命令装好。"

[tweak.cache-cleanup]
title = "缓存清理"
summary = "用每周运行的定时器清理下载的软件包，每个只保留最近几个版本。"

[tweak.ssd-trim]
title = "SSD TRIM"
summary = "每周告诉 SSD 一次哪些块是空闲的，让它保持高速、寿命更长。"

[tweak.journal-limit]
title = "日志大小限制"
summary = "通过单独的 drop-in 配置限制系统日志占用的磁盘空间。下次开机或 journald 重启后生效。"

[tweak.time-sync]
title = "时间同步"
summary = "用 systemd 自带的时间服务让时钟保持准确。"

[tweak.zram-swap]
title = "内存中的压缩交换分区"
summary = "在内存中添加一个压缩交换设备，大小为你内存的一半，与已有的交换空间并存而不取代它。下次开机或 zram 服务重新启动后生效。"

[tweak.bluetooth]
title = "蓝牙"
summary = "安装 bluez 及其工具，并启用蓝牙服务。"

[tweak.laptop-power]
title = "笔记本电源管理"
summary = "安装 tlp 并以其默认设置启用。如果 power-profiles-daemon 已经在管理电源，则让路。"

[tweak.nvidia-wayland]
title = "NVIDIA 与 Wayland"
summary = "启用 NVIDIA 的内核 modesetting 以及它的挂起服务，这是 Wayland 会话顺畅运行所需要的。下次开机后生效；如果 nvidia 模块已内置到 initramfs 中，还需要额外运行 `mkinitcpio -P`。"

[tweak.firewall]
title = "防火墙"
summary = "安装并启用 ufw：拦截所有传入连接，放行传出连接。qtools 不会开放任何端口，SSH 以及其他需要从外部访问的服务都要自行添加 ufw allow 规则。"

[tweak.ssh-hardening]
title = "SSH 加固"
summary = "通过单独的 drop-in 配置禁止 SSH 密码登录和 root 登录。下次重启 sshd 后生效，之后只能用密钥登录；如果是远程连接的机器，请先确认你的密钥已经就位。"

