# What stopped a step or an undo. {file}, {backup} and {folder} are paths; {found} and {said}
# are the machine's own text, shown as it is.
[problem]
"file-missing" = "{file} 不存在。"
"section-missing" = "{file} 中没有 [{section}] 部分。"
"option-differs" = "{file} 已将 {key} 设为 {found}。"
"file-differs" = "{file} 中是别的内容；第 {line} 行为：{found}"
"file-ends" = "{file} 中是别的内容；它在第 {line} 行之前就结束了。"
"list-not-set" = "{key} 既没有在 {file} 中设置，也没有在 {folder} 中设置。"
"list-unreadable" = "{key} 在 {file} 中设置，但现在无法读取该文件。"
"list-not-understood" = "{file} 设置该列表的方式 qtools 不会修改：{found}"
"list-not-in-file" = "{file} 不再设置该列表。"
"changed-after-write" = "{file} 在 qtools 写入后被改动过，因此保持原样，没有撤销任何内容。"
"backup-missing" = "{file} 的备份已不存在（{backup}），因此文件保持原样，没有撤销任何内容。"
"nothing-recorded" = "这一项不是 qtools 做的，没有可撤销的内容。"
"record-does-not-match" = "qtools 关于第 {step} 步的记录已与此项不符，没有撤销任何内容。"
"not-recorded" = "无法记录这项改动，因此已将其撤回：{why}"
"not-recorded-left" = "这项改动既无法记录也无法撤回，仍留在系统上：{why}"
"write-refused" = "无法写入 {file}。"
"write-refused-said" = "无法写入 {file}：{said}"
"root-to-read" = "只有 root 能读取此项是否已完成。应用时，qtools 会在你输入密码后先检查，并保留已存在的内容。"
"unreadable" = "qtools 无法读取此项的状态：{why}"
# The session that holds one terminal for a whole qtools: the process that carries the runs out,
# and the screen's side of it. {channel} is where the control channel would be, {reason} what the
# machine said about it.
[session]
"no-folder" = "这台机器上没有地方存放会话的控制通道，因此每次运行都会询问密码。"
"unknown-request" = "会话被要求做别的事，什么也没有做。"
"channel-failed" = "会话无法打开它的控制通道 {channel}：{reason}"
"channel-not-made" = "无法建立控制通道，因此这次运行使用自己的终端：{reason}"
"not-asked" = "在整个 qtools 期间保持同一个终端的会话已结束，因此这次运行使用自己的终端：{reason}"
"gone" = "在整个 qtools 期间保持同一个终端的会话已结束，因此这次运行没有执行。"

