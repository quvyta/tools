[package]
name = "quvyta-tools"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Applies the recommended Arch Linux settings from one list, with a preview, a backup and an undo (beta)"
repository = "https://github.com/quvyta/tools"
homepage = "https://quvyta.com/qtools/"
readme = "README.md"
keywords = ["arch-linux", "linux", "settings", "tui", "terminal"]
categories = ["command-line-utilities"]
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it.
include = ["src/**", "assets/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
quvyta-framework = { version = "0.1.8", features = ["pty"] }
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
